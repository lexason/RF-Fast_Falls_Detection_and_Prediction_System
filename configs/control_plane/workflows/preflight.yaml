api_version: v1
id: preflight
display_name: Simulation preflight
version: 1
safety_class: operational
required_scopes: [detection:read, health:read]
approval_policy: {mode: confirmation, reason_required: false, reference_required: false, distinct_approvers: false, approval_ttl_seconds: 0}
allowed_environments: [DEVELOPMENT]
allowed_source_states: [STOPPED, MAINTENANCE, FAILED]
locks: [pipeline:preflight, pipeline:health]
timeout_seconds: 60
dry_run_supported: true
idempotency: {scope: workflow_and_parameters, duplicate_behavior: return_existing}
parameters:
  profile: {type: string, required: true, enum: [simulation], pattern: "^[a-z][a-z0-9_]{1,63}$", max_length: 32, default: simulation}
steps:
  - id: validate_config
    action: config.validate
    arguments: {profile: {parameter_ref: profile}}
    depends_on: []
    timeout_seconds: 10
    retry: {max_attempts: 1, backoff_seconds: 0}
    cancellable: true
    on_failure: fail
  - id: collect_health
    action: health.collect
    arguments: {profile: {parameter_ref: profile}}
    depends_on: [validate_config]
    timeout_seconds: 30
    retry: {max_attempts: 2, backoff_seconds: 0.1}
    cancellable: true
    on_failure: fail
postconditions:
  - {subject: platform.preflight_completed, operator: is_true, expected: true}
rollback_not_safe_reason: Read-only validation and health collection do not require rollback.
audit:
  event_types: [workflow.requested, workflow.step.completed, workflow.completed]
  redact_fields: [authorization, token]
  reason_field: reason
