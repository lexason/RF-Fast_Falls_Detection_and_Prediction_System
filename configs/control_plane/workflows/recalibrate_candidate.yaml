api_version: v1
id: recalibrate_candidate
display_name: Generate candidate threshold study
version: 2
safety_class: maintenance
required_scopes: [model:recalibrate]
approval_policy: {mode: confirmation, reason_required: true, reference_required: false, distinct_approvers: false, approval_ttl_seconds: 0}
allowed_environments: [DEVELOPMENT]
allowed_source_states: [STOPPED, MAINTENANCE]
locks: [model:candidate]
timeout_seconds: 120
dry_run_supported: true
idempotency: {scope: workflow_and_parameters, duplicate_behavior: return_existing}
parameters:
  candidate_id: {type: string, required: true, pattern: "^[a-z0-9][a-z0-9._-]{2,63}$", max_length: 64}
steps:
  - id: generate_immutable_threshold_study
    action: model.recalibrate_candidate
    arguments:
      candidate_id: {parameter_ref: candidate_id}
    depends_on: []
    timeout_seconds: 60
    retry: {max_attempts: 1, backoff_seconds: 0}
    cancellable: true
    on_failure: fail
postconditions:
  - {subject: model.active_changed, operator: is_false, expected: false}
rollback_not_safe_reason: The action creates immutable evidence and never changes the candidate bundle or active model.
audit:
  event_types: [workflow.requested, workflow.step.completed, workflow.completed, workflow.failed]
  redact_fields: [authorization, token]
  reason_field: reason
