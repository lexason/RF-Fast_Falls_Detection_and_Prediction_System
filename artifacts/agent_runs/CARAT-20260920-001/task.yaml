acceptance_evidence:
  - Versioned workflows validate against the JSON Schema and closed action registry.
  - No HTTP or chat input reaches a shell or arbitrary executable.
  - Development authentication and scope-based RBAC deny unauthorised controls.
  - Idempotency, resource locks, approval, cancellation, rollback, and state transitions have tests.
  - Hash-chained audit records redact credentials and verify integrity.
  - Host/service/N210 health is source-labelled and N210 CPU/RAM/process/filesystem stay unavailable.
  - Training/evaluation create immutable candidates/evidence and never promote as a side effect.
  - Live RF and raw capture require runtime-bound two-person approval and finite execution bounds.
  - Promotion and rollback use verified artifact digests and active-pointer compare-and-swap.
  - Dashboard renders all required panels responsively and preserves existing research routes.
  - Chat is limited to Explain and Plan; the console exposes only registered parameter-free tools.
  - Baseline and new non-hardware tests pass, and an independent reviewer returns a disposition.
safety_constraints:
  - No RF transmission or model-pointer mutation is performed during implementation or validation.
  - Runtime actions use code-constructed argv with shell disabled; arbitrary command execution is absent.
  - Raw IQ is never exposed through dashboard endpoints.
human_approvals_required:
  - Runtime RF start, raw capture, model promotion, rollback, and other R4 actions retain their workflow-specific approvals.
